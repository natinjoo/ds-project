<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylecontact.css">
    
            
</head>
<body>
    <div class="child-2" id="contact"> 
    <fieldset>                  
    <h2>get in touch!</h2>  
    <p>if you wanna contact me, sign up here! notify me for any suggestions,bugs or anything else you wanna tell me!</p>
    <form>
    <label for="firstname">firstname :</label>
    <input type="text" id="firstname" name="firstname" value="john" required ><br>
    <label for="password">Password :</label>
    <input type="password" id="password" name="password" placeholder="make it secure!" required><br>
    <label for="email">Email :</label>
    <input type="email" id="email" name="email" required><br><br>
    <textarea name="message" rows="10" cols="20" maxlength="500"></textarea><br>
    <input type="submit" id="submit"name="submit"><br><br>
    </form>
    </div>

</body>
</html>
